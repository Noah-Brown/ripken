[project]
name = "ripken"
version = "0.1.0"
description = "Fantasy baseball in-season dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy>=2.0.50",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[tool.setuptools.packages.find]
include = ["backend*", "shared*"]

[tool.ruff]
line-length = 100
target-version = "py311"
